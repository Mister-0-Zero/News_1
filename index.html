<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Шаблон корпоративной новости"><title>Шаблон новости</title>
<link rel="stylesheet" href="styles.css"><script src="script.js" defer></script>
</head>
<body>
<header class="shell masthead"><a href="#top">Новости и события</a><span>Внутри команды</span></header>
<main id="top" class="shell">
<section class="hero"><p id="category" class="eyebrow"></p><h1 id="title"></h1><p id="lead"></p><a id="action" class="button" href="#participate">Подробнее</a><img id="hero-image" hidden alt=""></section>
<section><h2 id="intro-title"></h2><p id="intro-text"></p></section>
<section id="participate"><h2>Как участвовать</h2><div id="steps" class="grid"></div><p id="contact"></p></section>
<section><h2 id="prize-title"></h2><p id="prize-text"></p><img id="prize-image" hidden alt=""></section>
<section id="presentation" hidden><h2>Презентация</h2><div id="slides"></div><a id="deck-download" hidden>Скачать презентацию</a></section>
<section><h2 id="closing-title"></h2><p id="closing-text"></p></section>
<p id="load-error" role="alert" hidden>Не удалось загрузить content.json. Откройте страницу через локальный HTTP-сервер или GitHub Pages.</p>
</main><footer id="footer" class="shell"></footer>
</body></html>
